# Merge into your existing .pages.yml if you already have one.
media:
  input: images
  output: /images

content:
  - name: articles
    label: Articles (front page, archive & random picks)
    type: file
    path: articles.json
    format: json
    fields:
      - name: articles
        label: Articles
        type: object
        list: true
        fields:
          - { name: headline,  label: Headline,  type: string, required: true }
          - { name: url,       label: Page path (e.g. articles/robotdog.html), type: string, required: true }
          - { name: category,  label: Category,  type: string }
          - { name: summary,   label: Summary,   type: text }
          - { name: author,    label: Author,    type: string }
          - { name: date,      label: Date,      type: date }
          - { name: image,     label: Image,     type: image }
          - { name: image_alt, label: Image alt text, type: string }
          - { name: fit_image, label: Show whole image (no cropping), type: boolean }
          - { name: featured,  label: On the front page (hidden from archive and random picks), type: boolean }
