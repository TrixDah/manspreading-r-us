{% assign is_home = false %}
{% if page.url == '/' %}{% assign is_home = true %}{% endif %}
<header class="site-header">
  <a class="site-logo-link" href="{{ '/' | relative_url }}" aria-label="Return to homepage">
    <img src="{{ '/images/shorts.png' | relative_url }}" alt="Mentone Manspreaders logo" class="site-logo">
  </a>
  <div class="brand">
    {% if is_home %}
    <h1 class="brand-name">Mentone Manspreaders</h1>
    {% else %}
    <p class="brand-name"><a href="{{ '/' | relative_url }}">Mentone Manspreaders</a></p>
    {% endif %}
    <p class="motto">Knowledge That Spreads</p>
  </div>
  {% if is_home %}
  <div class="edition">
    YOUR LOCAL NEWS DESK<br>
    Independent. Curious. Constipated.
  </div>
  {% endif %}
</header>
