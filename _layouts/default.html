<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title | escape }} | {{ site.title }}{% else %}{{ site.title }} | {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.summary | default: site.tagline | strip_html | escape }}">
<link rel="icon" type="image/png" href="{{ '/images/shorts.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<div class="topline"></div>

{% include header.html %}

<nav aria-label="Main navigation">
  <div class="nav-inner">
    <a href="{{ '/' | relative_url }}#front-page">Front Page</a>
    <a href="{{ '/' | relative_url }}#local">Latest Stories</a>
    <a href="{{ '/about.html' | relative_url }}">About</a>
  </div>
</nav>

{{ content }}

<footer id="about">
  <strong>{{ site.title }}</strong>
  {{ site.tagline }}
  <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }} &middot; All rights reserved.</p>
</footer>

</body>
</html>
